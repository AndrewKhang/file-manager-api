<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>File Manager — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body>
  <div class="container">
    <div class="logo">File Manager</div>
    <div class="card">
      <h1>Welcome back</h1>
      <p class="subtitle">// sign in to your account</p>

      <div class="field">
        <label>Username</label>
        <input type="text" id="username" placeholder="your_username" autocomplete="username"/>
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
      </div>

      <button class="btn" id="loginBtn" onclick="handleLogin()">
        <span class="btn-text">Sign In</span>
        <div class="spinner"></div>
      </button>

      <div class="message" id="message"></div>

      <div class="footer">
        No account? <a href="index.html">Register here</a>
      </div>
    </div>
  </div>

  <script>
    const API = '';

    // Press Enter to submit
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });

    async function handleLogin() {
  // 1. get input
  const username = document.getElementById("username").value.trim()
  const password = document.getElementById("password").value

  // 2. Validate 
     if (!username || !password) {
        showMessage('error', 'Please fill in all fields.');
        return;
      }
  // 3. Call API POST /users/login
  const formData = new URLSearchParams();
  formData.append('username', username);
  formData.append('password', password);
  try{
  const res = await fetch(`${API}/users/login`, {
  method: 'POST',
  headers: {
    'Content-Type': 'application/x-www-form-urlencoded'
  },
  body: formData
})
const data = await res.json();

  if (res.ok) {
  localStorage.setItem('token', data.access_token);
  window.location.href = 'dashboard.html';
}
 else{
   showMessage('error', 'Invalid credentials');  
 }
} catch (err){
    showMessage('error', 'Cannot connect to server.');
}
}
  function showMessage(type, text) {
  const msg = document.getElementById('message');
  msg.className = `message ${type}`;
  msg.textContent = text;
}
  </script>
</body>
</html>
