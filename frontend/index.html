<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>File Manager — Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body>
  <div class="container">
    <div class="logo">File Manager</div>
    <div class="card">
      <h1>Create account</h1>
      <p class="subtitle">// join the file manager</p>

      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com"/>
      </div>

      <div class="field">
        <label>Username</label>
        <input type="text" id="username" placeholder="your_username"/>
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••"/>
      </div>

      <button class="btn" id="registerBtn" onclick="handleRegister()">
        <span class="btn-text">Register</span>
        <div class="spinner"></div>
      </button>

      <div class="message" id="message"></div>

      <div class="footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:8000';

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleRegister();
    });

    async function handleRegister() {
      const email = document.getElementById('email').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('registerBtn');

      if (!email || !username || !password) {
        showMessage('error', 'Please fill in all fields.');
        return;
      }

      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const res = await fetch(`${API}/users/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          showMessage('error', data.detail || 'Registration failed.');
          return;
        }

        showMessage('success', 'Account created! Check your email to verify.');

      } catch (err) {
        showMessage('error', 'Cannot connect to server.');
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    }

    function showMessage(type, text) {
      const msg = document.getElementById('message');
      msg.className = `message ${type}`;
      msg.textContent = text;
    }
  </script>
</body>
</html>
