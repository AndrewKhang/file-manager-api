<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Manager — Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <nav>
      <div class="nav-logo">File Manager</div>
      <div class="nav-right">
        <div class="user-badge">
          <span id="navUsername">—</span>
          <span class="role-tag" id="navRole">user</span>
        </div>
        <button class="btn-logout" onclick="logout()">logout</button>
      </div>
    </nav>

    <main>
      <div class="page-title">My Files</div>
      <p class="page-sub" id="pageSubtitle">// manage your uploads</p>

      <div class="banner" id="unverifiedBanner">
        [!] Your email is not verified. You cannot upload files until you verify
        your account.
      </div>

      <div class="upload-zone" id="uploadZone">
        <input
          type="file"
          id="fileInput"
          onchange="handleUpload(this.files[0])"
        />
        <div class="upload-icon"><i class="fa-regular fa-file"></i></div>
        <div class="upload-text">Drop a file here or <span>browse</span></div>
        <div class="upload-progress" id="uploadProgress">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
      </div>
      <input
        type="text"
        id="searchInput"
        class="search-input"
        oninput="searchFiles()"
        placeholder="Search files..."
      />
      <div class="section-header">
        <div class="section-title">Uploads</div>
        <div class="file-count" id="fileCount">0 files</div>
      </div>

      <div class="file-list" id="fileList">
        <div class="empty-state">
          <div class="empty-icon">[ ]</div>
          <div>No files yet</div>
        </div>
      </div>
       
      <div
        id="pagination"
        style="
          display: flex;
          gap: 12px;
          align-items: center;
          margin-top: 16px;
          font-size: 12px;
          color: var(--muted);
        "
      ></div>
      <section id="adminSection" style="display:none; margin-top:40px;">
         <div class="section-header">
          <div class="section-title">All Users</div>
          <div class="file-count" id="userCount">0 users</div>
        </div>
        <div class="file-list" id="userList"></div>
        </section>


    </main>

    <div class="toast" id="toast"></div>

    <div
      id="confirmModal"
      style="
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 200;
        align-items: center;
        justify-content: center;
      "
    >
      <div
        style="
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 32px;
          max-width: 360px;
          width: 90%;
          text-align: center;
        "
      >
        <p
          id="confirmMessage"
          style="font-size: 14px; margin-bottom: 24px; color: var(--text)"
        ></p>
        <div style="display: flex; gap: 12px; justify-content: center">
          <button
            id="confirmCancel"
            style="
              background: transparent;
              border: 1px solid var(--border);
              color: var(--muted);
              border-radius: 6px;
              padding: 8px 20px;
              font-family: &quot;DM Mono&quot;, monospace;
              cursor: pointer;
            "
          >
            Cancel
          </button>
          <button
            id="confirmOk"
            style="
              background: var(--error);
              border: none;
              color: #fff;
              border-radius: 6px;
              padding: 8px 20px;
              font-family: &quot;DM Mono&quot;, monospace;
              cursor: pointer;
            "
          >
            Delete
          </button>
        </div>
      </div>
    </div>

    <script>
      const API = "http://localhost:8000";
      let currentUser = null;
      let allFiles = [];
      let allUsers = [];
      let currentPage = 1;
      const PAGE_SIZE = 5;
      // Auth guard
      const token = localStorage.getItem("token");
      if (!token) window.location.href = "login.html";

      function authHeaders() {
        return { Authorization: `Bearer ${token}` };
      }

      async function init() {
        try {
          const res = await fetch(`${API}/users/me`, {
            headers: authHeaders(),
          });
          if (!res.ok) {
            logout();
            return;
          }
          currentUser = await res.json();

          document.getElementById("navUsername").textContent =
            currentUser.username;
          const roleTag = document.getElementById("navRole");
          roleTag.textContent = currentUser.role;
          roleTag.className = `role-tag ${currentUser.role}`;

         if (currentUser.role === 'admin') {
  document.getElementById('adminSection').style.display = 'block';
  loadUsers();
}

          if (!currentUser.is_verified) {
            document.getElementById("unverifiedBanner").style.display = "block";
            document.getElementById("uploadZone").style.opacity = "0.4";
            document.getElementById("uploadZone").style.pointerEvents = "none";
          }

          loadFiles();
        } catch {
          logout();
        }
      }

      function renderFiles(files) {
        const list = document.getElementById("fileList");
        if (files.length === 0) {
          list.innerHTML = `<div class="empty-state"><div class="empty-icon">[ ]</div><div>No files yet</div></div>`;
          return;
        }
        const start = (currentPage - 1) * PAGE_SIZE;
        const pageFiles = files.slice(start, start + PAGE_SIZE);
        list.innerHTML = pageFiles
          .map(
            (f, i) => `
        <div class="file-item" style="animation-delay:${i * 0.05}s">
          <div class="file-icon">${getFileIcon(f.filename)}</div>
          <div class="file-info">
            <div class="file-name">${f.filename}</div>
            <div class="file-meta">${formatSize(f.file_size)}</div>
          </div>
          <button class="btn-delete" onclick="previewFile(${f.id})">preview</button>
          <button class="btn-delete" onclick="deleteFile(${f.id}, '${f.filename}')">delete</button>
        </div>
      `,
          )
          .join("");
        const totalPages = Math.ceil(files.length / PAGE_SIZE);
        document.getElementById("pagination").innerHTML = `
  <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? "disabled" : ""}>prev</button>
  <span>${currentPage} / ${totalPages}</span>
  <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? "disabled" : ""}>next</button>
`;
      }

      async function loadFiles() {
        try {
          const res = await fetch(`${API}/files/`, { headers: authHeaders() });
          const files = await res.json();
          if (res.status === 401) { logout(); return; }
          allFiles = files;

          document.getElementById("fileCount").textContent =
            `${files.length} file${files.length !== 1 ? "s" : ""}`;
          renderFiles(files);
        } catch {
          showToast("error", "Failed to load files.");
        }
      }

      async function handleUpload(file) {
        if (!file) return;
        if (!currentUser.is_verified) {
          showToast("error", "Verify your email first.");
          return;
        }

        const progress = document.getElementById("uploadProgress");
        const fill = document.getElementById("progressFill");
        progress.style.display = "block";
        fill.style.width = "30%";

        const formData = new FormData();
        formData.append("file", file);

        try {
          fill.style.width = "60%";
          const res = await fetch(`${API}/files/upload`, {
            method: "POST",
            headers: authHeaders(),
            body: formData,
          });

          fill.style.width = "100%";
          if (res.status === 401) { logout(); return; }

          if (!res.ok) {
            const data = await res.json();
            showToast("error", data.detail || "Upload failed.");
            return;
          }

          showToast("success", `${file.name} uploaded!`);
          setTimeout(loadFiles, 300);
        } catch {
          showToast("error", "Upload failed.");
        } finally {
          setTimeout(() => {
            progress.style.display = "none";
            fill.style.width = "0%";
            document.getElementById("fileInput").value = "";
          }, 600);
        }
      }

      async function deleteFile(id, name) {
        showConfirm(`Delete "${name}"?`, async () => {
          try {
            const res = await fetch(`${API}/files/${id}`, {
              method: "DELETE",
              headers: authHeaders(),
            });

            if (res.status === 401) { logout(); return; }
            if (!res.ok) {
              const data = await res.json();
              showToast("error", data.detail || "Delete failed.");
              return;
            }

            showToast("success", `${name} deleted.`);
            loadFiles();
          } catch {
            showToast("error", "Delete failed.");
          }
        });
      }

      function showConfirm(message, onConfirm) {
        const modal = document.getElementById("confirmModal");
        document.getElementById("confirmMessage").textContent = message;
        modal.style.display = "flex";

        document.getElementById("confirmOk").onclick = () => {
          modal.style.display = "none";
          onConfirm();
        };
        document.getElementById("confirmCancel").onclick = () => {
          modal.style.display = "none";
        };
      }

      function logout() {
        localStorage.removeItem("token");
        window.location.href = "login.html";
      }

      async function previewFile(id) {
        const res = await fetch(`${API}/files/${id}/preview`, {
          headers: authHeaders(),
        });
        const blob = await res.blob(); // raw binary response
        const url = URL.createObjectURL(blob); // temp browser-local URL pointing to blob in RAM
        window.open(url, "_blank"); // browser renders it in new tab
      }

      function getFileIcon(filename) {
        const ext = filename.split(".").pop().toLowerCase();
        const icons = {
          pdf: "PDF",
          png: '<i class="fa-solid fa-file-image"></i>',
          jpg: '<i class="fa-solid fa-file-image"></i>',
          jpeg: '<i class="fa-solid fa-file-image"></i>',
          gif: '<i class="fa-solid fa-file-image"></i>',
          mp4: '<i class="fa-solid fa-file-video"></i>',
          mp3: '<i class="fa-solid fa-file-audio"></i>',
          zip: '<i class="fa-solid fa-file-zipper"></i>',
          txt: '<i class="fa-solid fa-file-lines"></i>',
          doc: '<i class="fa-solid fa-file-word"></i>',
          docx: '<i class="fa-solid fa-file-word"></i>',
        };
        return icons[ext] || '<i class="fa-solid fa-file"></i>';
      }

      function formatSize(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      }

      function showToast(type, text) {
        const toast = document.getElementById("toast");
        toast.className = `toast ${type}`;
        toast.textContent = text;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3000);
      }
      function changePage(page) {
        currentPage = page;
        renderFiles(allFiles);
      }
      // Drag & drop
      const zone = document.getElementById("uploadZone");
      zone.addEventListener("dragover", (e) => {
        e.preventDefault();
        zone.classList.add("drag-over");
      });
      zone.addEventListener("dragleave", () =>
        zone.classList.remove("drag-over"),
      );
      zone.addEventListener("drop", (e) => {
        e.preventDefault();
        zone.classList.remove("drag-over");
        const file = e.dataTransfer.files[0];
        if (file) handleUpload(file);
      });
      function searchFiles() {
        const query = document.getElementById("searchInput").value;
        const filtered = allFiles.filter((f) =>
          f.filename.toLowerCase().includes(query.toLowerCase()),
        );
        currentPage = 1;
        renderFiles(filtered);
      }
        async function loadUsers() {
        try {
          const res = await fetch(`${API}/users/admin/users`, { headers: authHeaders() });
          const users = await res.json();
          if (res.status === 401) { logout(); return; }
          const filtered = users.filter(u => u.role !== 'admin');
          allUsers = filtered;

          document.getElementById("userCount").textContent =
            `${filtered.length} user${filtered.length !== 1 ? "s" : ""}`;
          renderUsers(filtered);
        } catch {
          showToast("error", "Failed to load users.");
        }
      }
      function renderUsers(users) {
        const list = document.getElementById("userList");
        if (!list) return;
        if (users.length === 0) {
          list.innerHTML = `<div class="empty-state"><div class="empty-icon">[ ]</div><div>No users found</div></div>`;
          return;
        }
        list.innerHTML = users.map((u, i) => `
          <div class="file-item" style="animation-delay:${i * 0.05}s">
            <div class="file-icon"><i class="fa-solid fa-user"></i></div>
            <div class="file-info">
              <div class="file-name">${u.username}</div>
              <div class="file-meta">${u.email} · ${u.role} · ${u.is_verified ? 'verified' : 'unverified'}</div>
            </div>
            <button class="btn-delete" onclick="deleteUser(${u.id}, '${u.username}')">delete</button>
          </div>
        `).join('');
      }

      async function deleteUser(id, name) {
        showConfirm(`Delete "${name}"?`, async () => {
          try {
            const res = await fetch(`${API}/users/admin/users/${id}`, {
              method: "DELETE",
              headers: authHeaders(),
            });

            if (res.status === 401) { logout(); return; }
            if (!res.ok) {
              const data = await res.json();
              showToast("error", data.detail || "Delete failed.");
              return;
            }

            showToast("success", `${name} deleted.`);
            loadUsers();
          } catch {
            showToast("error", "Delete failed.");
          }
        });
      }

      init();
    </script>
  </body>
</html>
